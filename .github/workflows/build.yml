name: Build EpicLite

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build plugin jar
        working-directory: plugin
        run: gradle build --no-daemon

      - name: Zip resource pack
        run: |
          cd resourcepack && zip -r ../EpicLite-ResourcePack.zip .
          cd .. && sha1sum EpicLite-ResourcePack.zip | tee EpicLite-ResourcePack.sha1

      - uses: actions/upload-artifact@v4
        with:
          name: EpicLite
          path: |
            plugin/build/libs/*.jar
            EpicLite-ResourcePack.zip
            EpicLite-ResourcePack.sha1

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plugin/build/libs/*.jar
            EpicLite-ResourcePack.zip
            EpicLite-ResourcePack.sha1
